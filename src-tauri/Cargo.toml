[package]
name = "study-app"
version = "0.1.0"
description = "Local-First Medical AI Study Pipeline with Persistent WebView & MCP Bridge"
authors = ["User", "Gemini (Primary Architect)"]
license = "MIT"
repository = "https://github.com/StudyApp"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "study_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = ["unstable", "protocol-asset"] }
tauri-plugin-shell = "2.0.2"
tauri-plugin-fs = "2.0.2"
tauri-plugin-sql = { version = "2.0.1", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }

url = "2"
